name: Fetch Shields.io Badge

on:
  pull_request:
    branches:
      - main

jobs:
  fetch-badge:
    runs-on: ubuntu-latest
    env:
      SHIELDS_IMAGE: shieldsio/shields@sha256:087e5fca593dec48c2eb18db4f6986175bae6a5d23768d6fb07f671e3029df66

    steps:
      - name: Run Shields.io Docker container
        run: |
          docker pull ${{ env.SHIELDS_IMAGE }}
          docker run -d -p 4000:80 ${{ env.SHIELDS_IMAGE }}

      - name: Fetch badge from Shields.io
        run: |
          curl http://localhost:4000/badge/build-passing-brightgreen -o badge.svg

      - name: Upload badge as artifact
        uses: actions/upload-artifact@v3
        with:
          name: badge
          path: badge.svg
