name: Fetch Shields.io Badge

on:
  pull_request:
    branches:
      - main

jobs:
  fetch-badge:
    runs-on: ubuntu-latest
    steps:
      - name: Run Shields.io Docker container
        run: |
          docker pull shieldsio/shields
          docker run -d -p 4000:80 shieldsio/shields

      - name: Fetch badge from Shields.io
        run: |
          curl http://localhost:4000/badge/build-passing-brightgreen -o badge.svg

      - name: Upload badge as artifact
        uses: actions/upload-artifact@v3
        with:
          name: badge
          path: badge.svg
